  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd64a"/><stop offset="1" stop-color="#ffb21e"/>
    </linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86acff"/><stop offset="1" stop-color="#3f6ff0"/>
    </linearGradient>
  </defs>
  <rect id="fond-rect" width="1024" height="1024" fill="url(#fond)"/>
