  <g transform="translate(484 600) scale(7.8) translate(-60 -58)">
    <path d="M24 50 Q20 30 27 8 Q44 18 56 30 Z" fill="#6f98fb" stroke="#6f98fb" stroke-width="7" stroke-linejoin="round"/>
