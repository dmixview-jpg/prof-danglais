<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icône de l'app : la mascotte (chat bleu de l'app), version épurée, sur fond jaune, bulle « EN ».
       Régénérer les PNG : node outils/icones/generer.js -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd64a"/><stop offset="1" stop-color="#ffb21e"/>
    </linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86acff"/><stop offset="1" stop-color="#3f6ff0"/>
    </linearGradient>
  </defs>
  <rect id="fond-rect" width="1024" height="1024" fill="url(#fond)"/>
  <!-- tête du chat (mêmes formes que la mascotte de app.js, agrandies) -->
  <g transform="translate(512 545) scale(7.4) translate(-60 -58)">
    <path d="M24 46 L27 8 L55 28 Z" fill="#6f98fb" stroke="#6f98fb" stroke-width="7" stroke-linejoin="round"/>
    <path d="M31 38 L32.5 17 L48 29 Z" fill="#ff9fb8" stroke="#ff9fb8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M96 46 L93 8 L65 28 Z" fill="#6f98fb" stroke="#6f98fb" stroke-width="7" stroke-linejoin="round"/>
    <path d="M89 38 L87.5 17 L72 29 Z" fill="#ff9fb8" stroke="#ff9fb8" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="60" cy="58" rx="41" ry="34" fill="url(#chat)"/>
    <ellipse cx="44" cy="59" rx="9" ry="10.5" fill="#fff"/><circle cx="45.5" cy="61" r="5.8" fill="#18203a"/><circle cx="48" cy="58" r="2.1" fill="#fff"/>
    <ellipse cx="76" cy="59" rx="9" ry="10.5" fill="#fff"/><circle cx="77.5" cy="61" r="5.8" fill="#18203a"/><circle cx="80" cy="58" r="2.1" fill="#fff"/>
    <path d="M55.5 69 h9 l-4.5 5 z" fill="#ff7f9b" stroke="#ff7f9b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M52 76 q4 4.5 8 0 q4 4.5 8 0" fill="none" stroke="#1b2550" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- bulle « EN » -->
  <g transform="translate(712 150) rotate(8) scale(.82)">
    <path d="M0 0 h230 a46 46 0 0 1 46 46 v84 a46 46 0 0 1 -46 46 h-120 l-58 52 l8 -52 h-60 a46 46 0 0 1 -46 -46 v-84 a46 46 0 0 1 46 -46 z" transform="translate(-46 0)" fill="#fff"/>
    <text x="92" y="128" text-anchor="middle" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" font-size="118" fill="#2b59c3" letter-spacing="-2">EN</text>
  </g>
</svg>
