    <path d="M96 50 Q100 30 93 8 Q76 18 64 30 Z" fill="#6f98fb" stroke="#6f98fb" stroke-width="7" stroke-linejoin="round"/>
    <path d="M89 38 L87.5 17 L72 29 Z" fill="#ff9fb8" stroke="#ff9fb8" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="60" cy="58" rx="41" ry="34" fill="url(#chat)"/>
    <ellipse cx="44" cy="59" rx="9" ry="10.5" fill="#fff"/><circle cx="45.5" cy="61" r="5.8" fill="#18203a"/><circle cx="48" cy="58" r="2.1" fill="#fff"/>
    <ellipse cx="76" cy="59" rx="9" ry="10.5" fill="#fff"/><circle cx="77.5" cy="61" r="5.8" fill="#18203a"/><circle cx="80" cy="58" r="2.1" fill="#fff"/>
