# Vérifie les règles de sécurité Firestore sur l'émulateur Firebase : chaque test joue une attaque
# (prix fabriqué, essai à rallonge, faux administrateur…) ou un usage normal.
name: Règles Firestore

on:
  push:
    paths: ['firestore.rules', 'outils/programme/abonnement.json', 'test/regles.test.mjs', 'package*.json', '.github/workflows/regles.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run test:regles
