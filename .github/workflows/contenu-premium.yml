# Vérifie que public/curriculum.json correspond au programme, sans les leçons payantes.
# Les leçons payantes et leur envoi dans Firebase sont dans le dépôt privé prof-danglais-premium
# (workflow « Publier le contenu Premium »), pour qu'elles ne soient pas lisibles ici.
name: Vérifier le parcours public

on:
  push:
    branches: [main]
    paths: ['outils/programme/**', 'public/curriculum.json']
  pull_request:
    paths: ['outils/programme/**', 'public/curriculum.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construire le parcours public (Pré-A1 + titres des niveaux payants)
        run: python3 outils/programme/construire.py
      - name: Vérifier que public/curriculum.json est à jour
        run: git diff --exit-code public/curriculum.json || (echo "Lance python3 outils/programme/construire.py et publie le résultat." && exit 1)
      - name: Aucune leçon payante dans ce dépôt
        run: |
          if git ls-files outils/programme/contenu | grep -q .; then
            echo "::error::Les leçons payantes vont dans le dépôt privé prof-danglais-premium, pas ici."; exit 1
          fi
