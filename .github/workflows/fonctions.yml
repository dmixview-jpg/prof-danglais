# Teste la logique des fonctions Firebase (webhook RevenueCat) : en-tête secret, comptes touchés,
# droits actifs, attributs du jeton conservés.
name: Fonctions Firebase

on:
  push:
    paths: ['functions/**', '.github/workflows/fonctions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node -e "require('./index.js')"
